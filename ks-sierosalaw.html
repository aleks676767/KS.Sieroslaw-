<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>KS Sierosław – oficjalna strona klubu piłkarskiego</title>
<meta name="description" content="KS Sierosław – oficjalna strona klubu piłkarskiego. Terminarz meczów, kalendarz treningów, aktualności i galeria klubowa.">
<meta name="keywords" content="KS Sierosław, klub piłkarski Sierosław, piłka nożna Sierosław, KS Sierosław 2017">
<meta name="robots" content="index, follow">
<meta property="og:title" content="KS Sierosław">
<meta property="og:description" content="Oficjalna strona klubu piłkarskiego KS Sierosław – mecze, kalendarz, aktualności i galeria.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsClub",
  "name": "KS Sierosław",
  "sport": "Piłka nożna",
  "areaServed": "Sierosław"
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-deep:#0e3d1f;
  --green:#166534;
  --green-bright:#1e8a45;
  --gold:#f4c430;
  --gold-deep:#d9a600;
  --paper:#f7f5ee;
  --ink:#0e1f14;
  --ink-soft:#3c4a40;
  --line:#c9c2ab;
  --white:#ffffff;
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1a12;
    --ink:#eef2ea;
    --ink-soft:#aab7ad;
    --line:#2a3b2d;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1a12;
  --ink:#eef2ea;
  --ink-soft:#aab7ad;
  --line:#2a3b2d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, rgba(22,101,52,.08) 1px, transparent 0) 0 0/22px 22px,
    var(--paper);
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.num{
  font-family:'Oswald',system-ui,sans-serif;
  letter-spacing:0.01em;
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
.hide{display:none !important;}
img{max-width:100%;display:block;}

/* ---------- pitch background ---------- */
.pitch-bg{
  background:
    repeating-linear-gradient(
      100deg,
      var(--green) 0px, var(--green) 90px,
      var(--green-bright) 90px, var(--green-bright) 180px
    );
  position:relative;
}
.pitch-bg::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(14,61,31,0.15), rgba(14,61,31,0.55));
  pointer-events:none;
}

/* ================= SPLASH / HERO SCENE ================= */
#scene{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:8vh 1.2rem 3rem;
  overflow:hidden;
}
.crest{
  width:84px;height:107px;margin-bottom:.6rem;
  object-fit:contain;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));
}
.club-name{
  color:var(--white);
  text-align:center;
  font-size:clamp(1.6rem,7vw,2.4rem);
  font-weight:700;
  text-transform:none;
  line-height:1.05;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}
.club-sub{
  color:var(--gold);
  font-size:.95rem;
  letter-spacing:.06em;
  margin-top:.35rem;
  font-family:'Oswald',sans-serif;
}
.stage{
  position:relative;
  width:min(90vw,360px);
  height:300px;
  margin-top:2.2rem;
}
#playerSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.stage-caption{
  color:rgba(255,255,255,.75);font-size:.82rem;font-style:italic;
  text-align:center;margin-top:.6rem;letter-spacing:.02em;
}

.eye{transform-box:fill-box;transform-origin:50% 50%;animation:glance 2.6s ease-in-out infinite;}
.eye-right{animation-delay:.05s;}
@keyframes glance{
  0%,55%,100%{transform:translate(0,0)}
  62%{transform:translate(.6px,.9px)}
  75%{transform:translate(-.4px,.4px)}
}

.leg{transform-box:fill-box;transform-origin:50% 0%;}
.leg-left{animation:legL 0.62s ease-in-out infinite;}
.leg-right{animation:legR 0.62s ease-in-out infinite;}
@keyframes legL{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes legR{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-14deg)}}
.torso{animation:bob .62s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

#ballWrap{transform-box:fill-box;transform-origin:50% 50%;animation:juggle 0.62s ease-in-out infinite;}
@keyframes juggle{
  0%{transform:translateY(0) scale(1,1)}
  38%{transform:translateY(-62px) scale(0.97,1.03)}
  72%{transform:translateY(0) scale(1.08,0.9)}
  100%{transform:translateY(0) scale(1,1)}
}
#groundShadow{transition:opacity .3s ease;}

/* faza 1: mocne podbicie – sylwetka znika, "kamera" zostaje tylko na piłce */
.stage.kicking .leg,.stage.kicking .torso{animation:none !important;opacity:0;transform:scale(.9) translateY(10px);transition:opacity .38s ease, transform .38s ease;}
.stage.kicking #groundShadow{opacity:0;}
.stage.kicking #ballWrap{animation:riseZoom .62s cubic-bezier(.22,.7,.3,1) forwards;}
@keyframes riseZoom{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  100%{transform:translate(-6px,-120px) scale(1.65) rotate(250deg)}
}

/* faza 2: piłka (sama, w zbliżeniu) opada w dół */
.stage.falling .leg,.stage.falling .torso{opacity:0;}
.stage.falling #groundShadow{opacity:0;}
.stage.falling #ballWrap{animation:fallZoom .68s cubic-bezier(.5,0,.68,1) forwards;}
@keyframes fallZoom{
  0%{transform:translate(-6px,-120px) scale(1.65) rotate(250deg)}
  100%{transform:translate(0,0) scale(1) rotate(430deg)}
}

/* faza 3: odbicie od ziemi – dokładnie wtedy pojawia się panel logowania */
.stage.bouncing .leg,.stage.bouncing .torso{opacity:0;}
.stage.bouncing #groundShadow{opacity:1;}
.stage.bouncing #ballWrap{animation:bounceImpact .5s cubic-bezier(.3,1.4,.4,1) forwards;}
@keyframes bounceImpact{
  0%{transform:translate(0,0) scale(1,1) rotate(430deg)}
  22%{transform:translate(0,3px) scale(1.2,.76) rotate(438deg)}
  55%{transform:translate(0,-15px) scale(.92,1.08) rotate(450deg)}
  100%{transform:translate(0,0) scale(1,1) rotate(460deg)}
}

.stage.settled .leg,.stage.settled .torso{opacity:0;}
.stage.settled #groundShadow{opacity:1;}
.stage.settled #ballWrap{animation:idleFloat 1.7s ease-in-out infinite;}
@keyframes idleFloat{0%,100%{transform:translate(0,0) rotate(460deg)}50%{transform:translate(0,-5px) rotate(460deg)}}

#gate{
  width:min(94vw,380px);
  margin-top:1.6rem;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .5s ease, transform .5s ease;
}
#gate.show{opacity:1;transform:translateY(0);}

.ticket{
  background:var(--paper);
  border-radius:16px;
  padding:1.3rem 1.2rem 1.4rem;
  box-shadow:0 14px 34px rgba(0,0,0,.32);
  position:relative;
  border-top:3px solid var(--gold);
}
.ticket::before,.ticket::after{
  content:"";position:absolute;top:50%;width:18px;height:18px;
  background:#0e3d1f;border-radius:50%;transform:translateY(-50%);
}
.ticket::before{left:-9px;}
.ticket::after{right:-9px;}
.ticket + .ticket{margin-top:1rem;}
.gate-title{
  font-size:1.05rem;font-weight:600;color:var(--ink);
  text-align:center;margin-bottom:1rem;
}
.btn{
  display:block;width:100%;
  padding:.85rem 1rem;
  border-radius:10px;
  border:2px solid transparent;
  font-size:1rem;font-weight:600;
  text-align:center;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(155deg,var(--green-bright),var(--green-deep));color:var(--white);box-shadow:0 4px 12px rgba(14,61,31,.35);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:var(--green-deep);box-shadow:0 4px 12px rgba(217,166,0,.35);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--green);color:var(--green);}
.btn-row{display:flex;flex-direction:column;gap:.7rem;}
.btn-link{background:none;border:none;color:var(--ink-soft);font-size:.88rem;text-decoration:underline;padding:.4rem;}

label{display:block;font-size:.82rem;color:var(--ink-soft);margin:.7rem 0 .25rem;}
input,select,textarea{
  width:100%;padding:.65rem .7rem;border:1.5px solid var(--line);
  border-radius:8px;font-size:1rem;background:var(--white);color:var(--ink);
  font-family:inherit;transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(22,101,52,.15);}
.error-msg{color:#b3261e;font-size:.85rem;margin-top:.5rem;min-height:1.1em;}
.back-row{margin-top:.9rem;text-align:center;}

/* ---- ciemny formularz rejestracji ---- */
.login-form{
  display:flex;flex-direction:column;gap:10px;
  max-width:300px;margin:0 auto;padding:20px;
  background:linear-gradient(165deg,#242424,#161616);border-radius:12px;color:#fff;
  font-family:Arial, sans-serif;box-shadow:0 14px 34px rgba(0,0,0,.4);
}
.login-form h2{color:#fff;text-align:center;font-family:Arial, sans-serif;font-size:1.3rem;margin-bottom:4px;}
.login-form input{
  padding:10px;border:none;border-radius:5px;font-size:1rem;
  background:#fff;color:#111;
}
.login-form input:focus{outline:2px solid var(--gold);box-shadow:none;}
.login-form button{
  padding:10px;border:none;border-radius:5px;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:#1e1e1e;font-weight:700;cursor:pointer;font-size:1rem;
  box-shadow:0 4px 12px rgba(217,166,0,.35);
}
.login-form button:hover{filter:brightness(1.06);}
.login-form .signup{color:#ccc;font-size:.85rem;text-align:center;margin:4px 0 0;}
.login-form .signup a{color:var(--gold);text-decoration:underline;}
.login-form .error-msg{color:#ff6b6b;text-align:center;margin:0;}

/* ================= APP (po zalogowaniu) ================= */
#app{display:none;min-height:100svh;background:var(--paper);}
#app.active{display:block;}
.topbar{
  background:linear-gradient(120deg,var(--green-deep),#0a2c17);color:var(--white);
  padding:.9rem 1.1rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;
  box-shadow:0 3px 14px rgba(0,0,0,.25);
}
.topbar-id{display:flex;align-items:center;gap:.6rem;}
.mini-crest{width:32px;height:41px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.topbar-club{font-family:'Oswald';font-size:1.05rem;font-weight:600;letter-spacing:.01em;}
.topbar-role{font-size:.72rem;color:var(--gold);}
.menu-btn{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));border:none;color:var(--green-deep);
  font-size:1.3rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .12s ease;
}
.menu-btn:active{transform:scale(.92);}

.hero-banner{
  position:relative;padding:1.8rem 1.1rem 2.6rem;overflow:hidden;
  background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.18));
}
.pitch-lines{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;}
.hero-banner .float-ball{
  position:absolute;font-size:2.4rem;opacity:.3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
  animation:floaty 4.5s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(18deg)}}
.fb1{top:6%;left:8%;animation-delay:0s;}
.fb2{top:60%;right:10%;animation-delay:1.2s;font-size:1.8rem;}
.fb3{bottom:4%;left:36%;animation-delay:2.1s;font-size:1.4rem;}
.hero-inner{position:relative;z-index:2;color:var(--white);text-align:center;}
.hero-inner .num{font-size:2.6rem;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.3);}
.hero-inner p{margin:.2rem 0 0;font-size:.95rem;opacity:.92;}

.stats-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;
  padding:0 1.1rem;margin-top:-1.6rem;position:relative;z-index:3;
}
.stat-card{
  background:var(--white);border-radius:14px;padding:.85rem .4rem;
  text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.14);
  border-bottom:3px solid var(--gold);
}
.stat-card .num{font-size:1.6rem;color:var(--green);font-weight:600;}
.stat-card .lbl{font-size:.68rem;color:var(--ink-soft);margin-top:.15rem;text-transform:uppercase;letter-spacing:.03em;}

.content{padding:1.4rem 1.1rem 5rem;max-width:640px;margin:0 auto;}
.section-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.25rem;margin-bottom:.9rem;
}
.section-title .sec-ic{font-size:1.25rem;line-height:1;}
.section-title .dash{width:26px;height:5px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:3px;}

@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  background:var(--white);border-radius:14px;padding:1.1rem;
  box-shadow:0 5px 16px rgba(0,0,0,.08);margin-bottom:.9rem;
  border-left:4px solid var(--green);position:relative;
  transition:box-shadow .15s ease, transform .15s ease;
  animation:cardIn .32s ease both;
}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.12);}
.card.gold{border-left-color:var(--gold);}
.card h3{font-size:1.02rem;margin-bottom:.2rem;}
.card .meta{font-size:.78rem;color:var(--ink-soft);}
.pill{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:600;
  padding:.25rem .6rem;border-radius:99px;margin-top:.4rem;
  background:var(--green);color:var(--white);letter-spacing:.02em;
}
.pill.sparing{background:#3f7cac;}
.pill.trening{background:#8a6d1d;}
.pill.wolne{background:#6b6b6b;}
.pill.mecz{background:var(--green);}

.empty{
  text-align:center;padding:2.2rem 1rem;color:var(--ink-soft);
  border:1.5px dashed var(--line);border-radius:14px;font-size:.92rem;
  background:rgba(22,101,52,.03);
}
.empty .empty-ic{display:block;font-size:2.1rem;margin-bottom:.5rem;}

.fab-add{
  position:fixed;right:1.1rem;bottom:1.3rem;z-index:40;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:var(--green-deep);border:none;
  font-size:1.8rem;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .12s ease;
}
.fab-add:active{transform:scale(.92);}

/* nav drawer */
#navOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:49;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
#navOverlay.show{opacity:1;pointer-events:auto;}
#navDrawer{
  position:fixed;top:0;right:0;height:100%;width:min(82vw,320px);
  background:var(--green-deep);z-index:50;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  padding:1.4rem 1.1rem;color:var(--white);overflow-y:auto;
}
#navDrawer.show{transform:translateX(0);}
.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.85rem .6rem;border-radius:10px;
  font-size:1.02rem;color:var(--white);background:none;border:none;
  width:100%;text-align:left;font-family:inherit;
}
.nav-item:active{background:rgba(255,255,255,.08);}
.nav-item .ic{font-size:1.25rem;width:1.5rem;text-align:center;}
.nav-item.active{background:var(--gold);color:var(--green-deep);font-weight:600;}
.nav-close{
  background:none;border:none;color:var(--white);font-size:1.6rem;
  float:right;margin-bottom:.6rem;
}
.nav-foot{margin-top:1.4rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.2);}

/* modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.modal-bg.show{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--paper);width:100%;max-width:480px;
  border-radius:18px 18px 0 0;padding:1.3rem 1.2rem 1.6rem;
  max-height:88vh;overflow-y:auto;
  transform:translateY(30px);transition:transform .25s ease;
}
.modal-box::before{
  content:"";display:block;width:38px;height:4px;border-radius:3px;
  background:var(--line);margin:-.4rem auto 1rem;
}
.modal-bg.show .modal-box{transform:translateY(0);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.modal-head h3{font-size:1.1rem;}
.modal-x{background:none;border:none;font-size:1.4rem;color:var(--ink-soft);}
.field-row{display:flex;gap:.6rem;}
.field-row > div{flex:1;}

/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;}
.cal-nav button{background:var(--green);color:var(--white);border:none;border-radius:8px;padding:.5rem .8rem;font-size:1rem;}
.cal-nav .cal-title{font-family:'Oswald';font-size:1.15rem;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:.68rem;color:var(--ink-soft);padding-bottom:.25rem;}
.cal-day{
  aspect-ratio:1;border-radius:10px;background:var(--white);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:500;border:1.5px solid var(--line);position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .1s ease, box-shadow .1s ease;
}
.cal-day:active{transform:scale(.93);}
.cal-day.empty-cell{background:transparent;border:none;box-shadow:none;}
.cal-day.today{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 3px rgba(244,196,48,.18);}
.cal-day .dot{width:6px;height:6px;border-radius:50%;margin-top:2px;}
.cal-day.mecz{background:#e7f5ec;}
.cal-day.sparing{background:#e6f0f9;}
.cal-day.trening{background:#f7f0da;}
.cal-day.wolne{background:#efefef;}
.year-tabs{display:flex;gap:.5rem;margin-bottom:.7rem;}
.year-tabs button{
  flex:1;padding:.55rem;border-radius:9px;border:1.5px solid var(--line);
  background:var(--white);font-weight:600;color:var(--ink-soft);transition:all .15s ease;
}
.year-tabs button.active{background:linear-gradient(155deg,var(--green-bright),var(--green));color:var(--white);border-color:var(--green);box-shadow:0 3px 10px rgba(22,101,52,.3);}
.month-scroll{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:.6rem;}
.month-chip{
  flex:0 0 auto;padding:.45rem .85rem;border-radius:99px;border:1.5px solid var(--line);
  background:var(--white);font-size:.82rem;white-space:nowrap;transition:all .15s ease;
}
.month-chip.active{background:linear-gradient(155deg,#ffdd66,var(--gold-deep));border-color:var(--gold);color:var(--green-deep);font-weight:600;box-shadow:0 3px 10px rgba(217,166,0,.3);}
.legend{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem;font-size:.75rem;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:.3rem;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;}
.gallery-tile{
  border-radius:14px;overflow:hidden;aspect-ratio:1;position:relative;
  box-shadow:0 6px 16px rgba(0,0,0,.15);background:var(--green);
}
.gallery-tile img{width:100%;height:100%;object-fit:cover;}
.gallery-tile .cap{
  position:absolute;left:0;right:0;bottom:0;padding:.5rem .6rem;
  background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);
  color:var(--white);font-size:.72rem;font-weight:500;
}
.del-btn{
  background:none;border:none;color:#b3261e;font-size:.78rem;
  position:absolute;top:.6rem;right:.6rem;
}

      <div id="viewChoice" class="btn-row">
        <button class="btn btn-gold" onclick="showView('register')">Zarejestruj się</button>
        <button class="btn btn-primary" onclick="showView('roleChoice')">Zaloguj się</button>
      </div>

      <div id="viewRoleChoice" class="btn-row hide">
        <button class="btn btn-primary" onclick="showView('coachLogin')">Zaloguj jako trener</button>
        <button class="btn btn-outline" onclick="showView('playerLogin')">Zaloguj jako piłkarz</button>
        <button class="btn-link" onclick="showView('choice')">&larr; Wróć</button>
      </div>

      <form id="viewCoachLogin" class="hide" onsubmit="return doCoachLogin(event)">
        <label>Imię trenera</label>
        <input type="text" id="coachName" autocomplete="off" required>
        <label>Hasło</label>
        <input type="password" id="coachPass" autocomplete="off" required>
        <div class="error-msg" id="coachErr"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:.4rem;">Zaloguj</button>
        <div class="back-row"><button type="button" class="btn-link" onclick="showView('roleChoice')">&larr; Wróć</button></div>
      </form>

      <form id="viewPlayerLogin" class="hide" onsubmit="return doPlayerLogin(event)">
        <label>Imię i nazwisko</label>
        <input type="text" id="plName" autocomplete="off" required>
        <label>Hasło</label>
        <input type="password" id="plPass" autocomplete="off" required>
        <div class="error-msg" id="plErr"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:.4rem;">Zaloguj</button>

      </form>

      <form id="viewRegister" class="hide login-form" onsubmit="return doRegister(event)">
        <h2>Rejestracja</h2>
        <input type="text" id="regName" placeholder="Imię i nazwisko" autocomplete="off" required>
        <input type="password" id="regPass" placeholder="Hasło (min. 4 znaki)" autocomplete="off" required minlength="4">
        <div class="error-msg" id="regErr"></div>
        <button type="submit">Zarejestruj</button>
        <p class="signup">Masz już konto? <a href="#" onclick="event.preventDefault(); showView('roleChoice');">Zaloguj się</a></p>

<script>
/* ============================================================
   DANE — zapisywane lokalnie w przeglądarce (localStorage)
   ============================================================ */
const STORE_KEY = 'ksSierosLaw_v1';
const COACH_NAME = 'Aleks';
const COACH_PASS = 'AnAroszyk917';
const MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const DOWS = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { players: [], matches: [], calendar: {}, absences: [], news: [], gallery: [] };
}
function saveData(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    return false;
  }
}
function setSession(s){
  try{
    sessionStorage.setItem('ksSession', JSON.stringify(s));
  }catch(e){}
}

let data = loadData();
let session = JSON.parse(sessionStorage.getItem('ksSession') || 'null');
let calView = { year: 2026, month: 9 }; // wrzesień domyślnie
let currentTab = 'home';
let editingAbsenceDate = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================================================
   SCENA POWITALNA / LOGOWANIE
   ============================================================ */
function showView(name){
  ['Choice','RoleChoice','CoachLogin','PlayerLogin','Register'].forEach(v=>{
    document.getElementById('view'+v).classList.add('hide');
  });
  const map = { choice:'Choice', roleChoice:'RoleChoice', coachLogin:'CoachLogin', playerLogin:'PlayerLogin', register:'Register' };
  document.getElementById('view'+map[name]).classList.remove('hide');
  const titles = {
    choice:'Witaj w strefie klubu', roleChoice:'Jak się logujesz?',
    coachLogin:'Logowanie — trener', playerLogin:'Logowanie — piłkarz',
    register:'Załóż konto zawodnika'
  };
  document.getElementById('gateTitle').textContent = titles[name];
  document.getElementById('gateTitle').style.display = (name==='register') ? 'none' : '';
}

function doCoachLogin(e){
  e.preventDefault();
  const name = document.getElementById('coachName').value.trim();
  const pass = document.getElementById('coachPass').value;
  const err = document.getElementById('coachErr');
  if(name === COACH_NAME && pass === COACH_PASS){
    session = { role:'coach', name: COACH_NAME };
    setSession(session);
    enterApp();
  } else {
    err.textContent = 'Błędne imię lub hasło trenera.';
  }
  return false;
}

function doRegister(e){
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const pass = document.getElementById('regPass').value;
  const err = document.getElementById('regErr');
  if(!name || pass.length < 4){ err.textContent = 'Podaj imię i hasło (min. 4 znaki).'; return false; }
  if(data.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){
    err.textContent = 'Zawodnik o tym imieniu już ma konto — zaloguj się.';
    return false;
  }
  data.players.push({ name, pass });
  if(!saveData()){
    err.textContent = 'Nie udało się zapisać konta w tej przeglądarce (np. tryb prywatny). Wyłącz tryb prywatny i spróbuj ponownie.';
    data.players.pop();
    return false;
  }
  session = { role:'player', name };
  setSession(session);
  enterApp();
  return false;
}

function doPlayerLogin(e){
  e.preventDefault();
  const name = document.getElementById('plName').value.trim();
  const pass = document.getElementById('plPass').value;
  const err = document.getElementById('plErr');
  const p = data.players.find(p=>p.name.toLowerCase()===name.toLowerCase() && p.pass===pass);
  if(!p){ err.textContent = 'Nie znaleziono konta lub błędne hasło.'; return false; }
  session = { role:'player', name: p.name };
  setSession(session);
  enterApp();
  return false;
}

function logout(){
  session = null;
  sessionStorage.removeItem('ksSession');
  document.getElementById('app').classList.remove('active');
  document.getElementById('scene').classList.remove('hide');
  closeNav();
  showView('choice');
}

function enterApp(){
  document.getElementById('scene').classList.add('hide');
  document.getElementById('app').classList.add('active');
  document.getElementById('topbarRole').textContent = session.role==='coach' ? 'Trener · '+session.name : 'Zawodnik · '+session.name;
  document.getElementById('heroGreeting').textContent = 'Cześć, ' + session.name.split(' ')[0] + '!';
  document.getElementById('heroSub').textContent = session.role==='coach' ? 'Zarządzaj klubem z poziomu jednego menu' : 'Sprawdź plan zajęć i nowości klubowe';
  goTab('home');
}

/* ============================================================
   ANIMACJA WSTĘPNA
   ============================================================ */
function playIntro(){
  const stage = document.getElementById('stage');
  const ball = document.getElementById('ballWrap');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    document.getElementById('gate').classList.add('show');
    return;
  }
  setTimeout(()=>{
    // faza 1: mocne podbicie — piłka wylatuje w górę, kamera "zostaje" tylko na niej
    stage.classList.add('kicking');
    ball.addEventListener('animationend', function onRise(ev){
      if(ev.animationName !== 'riseZoom') return;
      ball.removeEventListener('animationend', onRise);
      stage.classList.remove('kicking');
      stage.classList.add('falling');
      // faza 2: piłka (w zbliżeniu, bez chłopaka) opada w dół
      ball.addEventListener('animationend', function onFall(ev2){
        if(ev2.animationName !== 'fallZoom') return;
        ball.removeEventListener('animationend', onFall);
        stage.classList.remove('falling');
        stage.classList.add('bouncing');
        // faza 3: dokładnie w momencie odbicia od ziemi — pokazujemy logowanie
        document.getElementById('gate').classList.add('show');
        ball.addEventListener('animationend', function onBounce(ev3){
          if(ev3.animationName !== 'bounceImpact') return;
          ball.removeEventListener('animationend', onBounce);
          stage.classList.remove('bouncing');
          stage.classList.add('settled');
        });
      });
    });
  }, 2480);
}

/* ============================================================
   NAWIGACJA
   ============================================================ */
function openNav(){ document.getElementById('navOverlay').classList.add('show'); document.getElementById('navDrawer').classList.add('show'); }
function closeNav(){ document.getElementById('navOverlay').classList.remove('show'); document.getElementById('navDrawer').classList.remove('show'); }

function goTab(tab){
  currentTab = tab;
  closeNav();
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.tab===tab));
  render();
  document.getElementById('content').scrollIntoView({behavior:'instant', block:'start'});
}

/* ============================================================
   RENDEROWANIE ZAKŁADEK
   ============================================================ */
function render(){
  document.getElementById('statMatches').textContent = data.matches.length;
  document.getElementById('statPlayers').textContent = data.players.length + 1;
  document.getElementById('statNews').textContent = data.news.length;

  const c = document.getElementById('content');
  if(currentTab==='home') c.innerHTML = renderHome();
  else if(currentTab==='matches') c.innerHTML = renderMatches();
  else if(currentTab==='calendar') c.innerHTML = renderCalendar();
  else if(currentTab==='absences') c.innerHTML = renderAbsences();
  else if(currentTab==='news') c.innerHTML = renderNews();
  else if(currentTab==='gallery') c.innerHTML = renderGallery();
  attachFab();
}

function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pl-PL', { day:'numeric', month:'long', year:'numeric' });
}

function renderHome(){
  const nextMatch = data.matches.slice().sort((a,b)=>a.date.localeCompare(b.date)).find(m=>m.date >= todayISO());
  const latestNews = data.news.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,2);
  let html = `<div class="section-title"><span class="sec-ic">&#127968;</span><span class="dash"></span><h2>Menu główne</h2></div>`;
  html += `<div class="card gold"><h3>${nextMatch ? 'Najbliższy termin' : 'Brak zaplanowanych meczów'}</h3>`;
  if(nextMatch){
    html += `<div class="meta">${fmtDate(nextMatch.date)} · ${esc(nextMatch.opponent||'')}</div>
    <span class="pill ${pillClass(nextMatch.type)}">${esc(nextMatch.type)}</span>`;
  } else {
    html += `<div class="meta">Zajrzyj do zakładki Kalendarz.</div>`;
  }
  html += `</div>`;

  html += `<div class="section-title" style="margin-top:1.4rem;"><span class="sec-ic">&#128204;</span><span class="dash"></span><h2>Skrót do zakładek</h2></div>`;
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;">`;
  html += quickTile('matches','&#9917;','Mecze');
  html += quickTile('calendar','&#128197;','Kalendarz');
  html += quickTile('absences','&#9997;','Nieobecności');
  html += quickTile('news','&#128240;','Aktualności');
  html += quickTile('gallery','&#128247;','Galeria');
  html += `</div>`;

  if(latestNews.length){
    html += `<div class="section-title" style="margin-top:1.4rem;"><span class="sec-ic">&#128240;</span><span class="dash"></span><h2>Ostatnie aktualności</h2></div>`;
    latestNews.forEach(n=>{
      html += `<div class="card"><h3>${esc(n.title)}</h3><div class="meta">${fmtDate(n.date)}</div><p style="margin:.5rem 0 0;font-size:.9rem;">${esc(n.content)}</p></div>`;
    });
  }
  return html;
}
function quickTile(tab, icon, label){
  return `<button onclick="goTab('${tab}')" style="background:var(--white);border:none;border-radius:14px;padding:1rem .6rem;box-shadow:0 4px 12px rgba(0,0,0,.08);text-align:center;">
    <div style="font-size:1.6rem;">${icon}</div>
    <div style="font-size:.82rem;margin-top:.3rem;font-weight:600;">${label}</div>
  </button>`;
}
function pillClass(type){
  const t=(type||'').toLowerCase();
  if(t.includes('spar')) return 'sparing';
  if(t.includes('tren')) return 'trening';
  if(t.includes('woln')) return 'wolne';
  return 'mecz';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------- MECZE ---------- */
function renderMatches(){
  let html = `<div class="section-title"><span class="sec-ic">&#9917;</span><span class="dash"></span><h2>Mecze</h2></div>`;
  const list = data.matches.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){
    html += `<div class="empty"><span class="empty-ic">&#9917;</span>Brak dodanych meczów. ${session.role==='coach' ? 'Dodaj pierwszy meczowy termin przyciskiem +.' : 'Trener jeszcze nic tu nie dodał.'}</div>`;
  } else {
    list.forEach(m=>{
      html += `<div class="card">
        ${session.role==='coach' ? `<button class="del-btn" onclick="deleteMatch('${m.id}')">Usuń</button>` : ''}
        <h3>${esc(m.opponent || 'Trening drużyny')}</h3>
        <div class="meta">${fmtDate(m.date)}${m.location ? ' · '+esc(m.location) : ''}</div>
        <span class="pill ${pillClass(m.type)}">${esc(m.type)}</span>
        ${m.score ? `<div style="margin-top:.5rem;font-family:'Oswald';font-size:1.2rem;">${esc(m.score)}</div>` : ''}
        ${m.note ? `<p style="margin:.5rem 0 0;font-size:.88rem;color:var(--ink-soft);">${esc(m.note)}</p>` : ''}

function deleteMatch(id){
  if(session.role!=='coach') return;

}
function openMatchModal(){

/* ---------- KALENDARZ ---------- */
function renderCalendar(){
  let html = `<div class="section-title"><span class="sec-ic">&#128197;</span><span class="dash"></span><h2>Kalendarz</h2></div>`;
  html += `<div class="year-tabs">
    <button class="${calView.year===2026?'active':''}" onclick="setCalYear(2026)">2026</button>
    <button class="${calView.year===2027?'active':''}" onclick="setCalYear(2027)">2027</button>
  </div>`;
  html += `<div class="month-scroll">`;
  MONTHS.forEach((m,i)=>{
    html += `<button class="month-chip ${calView.month===i+1?'active':''}" onclick="setCalMonth(${i+1})">${m}</button>`;
  });
  html += `</div>`;

  html += `<div class="cal-nav">
    <button onclick="shiftMonth(-1)">&larr;</button>
    <div class="cal-title">${MONTHS[calView.month-1]} ${calView.year}</div>
    <button onclick="shiftMonth(1)">&rarr;</button>
  </div>`;

  html += `<div class="cal-grid">`;
  DOWS.forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  const first = new Date(calView.year, calView.month-1, 1);
  let startOffset = first.getDay()===0 ? 6 : first.getDay()-1;
  const daysInMonth = new Date(calView.year, calView.month, 0).getDate();
  for(let i=0;i<startOffset;i++) html += `<div class="cal-day empty-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${calView.year}-${String(calView.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = data.calendar[iso];
    const cls = ev ? pillClass(ev.type) : '';
    const isToday = iso === todayISO();
    html += `<button class="cal-day ${cls} ${isToday?'today':''}" onclick="openDayModal('${iso}')">
      <div>${d}</div>${ev ? `<div class="dot" style="background:var(--green)"></div>` : ''}
    </button>`;
  }
  html += `</div>`;

  html += `<div class="legend">
    <span><i style="background:#e7f5ec;border:1px solid var(--green)"></i> Mecz</span>
    <span><i style="background:#e6f0f9;border:1px solid #3f7cac"></i> Sparing</span>
    <span><i style="background:#f7f0da;border:1px solid #8a6d1d"></i> Trening</span>
    <span><i style="background:#efefef;border:1px solid #999"></i> Wolne</span>
  </div>`;
  return html;
}
function setCalYear(y){ calView.year=y; render(); }
function setCalMonth(m){ calView.month=m; render(); }
function shiftMonth(dir){
  calView.month += dir;
  if(calView.month<1){ calView.month=12; calView.year--; }
  if(calView.month>12){ calView.month=1; calView.year++; }
  if(calView.year<2026){ calView.year=2026; calView.month=1; }
  if(calView.year>2027){ calView.year=2027; calView.month=12; }
  render();
}
function openDayModal(iso){
  const ev = data.calendar[iso];
  if(session.role==='coach'){
    openModal(`
      <div class="modal-head"><h3>${fmtDate(iso)}</h3><button class="modal-x" onclick="closeModal()">&times;</button></div>
      <form onsubmit="return saveDay(event,'${iso}')">
        <label>Rodzaj dnia</label>
        <select id="dType">
          <option ${ev&&ev.type==='Mecz'?'selected':''}>Mecz</option>
          <option ${ev&&ev.type==='Sparing'?'selected':''}>Sparing</option>
          <option ${ev&&ev.type==='Trening'?'selected':''}>Trening</option>
          <option ${ev&&ev.type==='Wolne'?'selected':''}>Wolne</option>
        </select>
        <label>Notatka</label>
        <textarea id="dNote" rows="2">${ev?esc(ev.note||''):''}</textarea>
        <div style="display:flex;gap:.6rem;margin-top:1rem;">
          <button type="submit" class="btn btn-primary">Zapisz</button>
          ${ev ? `<button type="button" class="btn btn-outline" onclick="clearDay('${iso}')">Usuń wpis</button>` : ''}
        </div>
      </form>
    `);
  } else {
    openModal(`
      <div class="modal-head"><h3>${fmtDate(iso)}</h3><button class="modal-x" onclick="closeModal()">&times;</button></div>
      ${ev ? `<span class="pill ${pillClass(ev.type)}">${esc(ev.type)}</span><p style="margin-top:.7rem;">${esc(ev.note||'Brak dodatkowych informacji.')}</p>`
           : `<p>Trener nie zaplanował jeszcze nic na ten dzień.</p>`}
      <button class="btn btn-gold" style="margin-top:1rem;" onclick="closeModal(); goTab('absences'); prefillAbsence('${iso}')">Zgłoś nieobecność na ten dzień</button>
    `);
  }
}
function saveDay(e, iso){
  e.preventDefault();
  if(session.role!=='coach') return false;
  data.calendar[iso] = { type: document.getElementById('dType').value, note: document.getElementById('dNote').value.trim() };
  saveData(); closeModal(); render();
  return false;
}
function clearDay(iso){ if(session.role!=='coach') return; delete data.calendar[iso]; saveData(); closeModal(); render(); }

/* ---------- NIEOBECNOŚCI ---------- */
function prefillAbsence(iso){ editingAbsenceDate = iso; render(); }
function renderAbsences(){
  let html = `<div class="section-title"><span class="sec-ic">&#9997;</span><span class="dash"></span><h2>Nieobecności</h2></div>`;
  if(session.role==='player'){
    html += `<div class="card">
      <h3>Zgłoś nieobecność</h3>
      <form onsubmit="return submitAbsence(event)">
        <label>Data</label><input type="date" id="abDate" required value="${editingAbsenceDate||todayISO()}">
        <label>Powód</label><textarea id="abReason" rows="2" placeholder="np. wyjazd rodzinny" required></textarea>
        <button type="submit" class="btn btn-primary" style="margin-top:.8rem;">Wyślij do trenera</button>
      </form>
    </div>`;
    const mine = data.absences.filter(a=>a.player===session.name).sort((a,b)=>b.date.localeCompare(a.date));
    html += `<div class="section-title" style="margin-top:1.2rem;"><span class="sec-ic">&#128203;</span><span class="dash"></span><h2>Twoje zgłoszenia</h2></div>`;
    html += mine.length ? mine.map(a=>`<div class="card"><div class="meta">${fmtDate(a.date)}</div><p style="margin:.3rem 0 0;">${esc(a.reason)}</p></div>`).join('')
                         : `<div class="empty"><span class="empty-ic">&#9997;</span>Nie zgłosiłeś jeszcze żadnej nieobecności.</div>`;
  } else {
    const all = data.absences.slice().sort((a,b)=>b.date.localeCompare(a.date));
    html += all.length ? all.map(a=>`<div class="card">
        <button class="del-btn" onclick="deleteAbsence('${a.id}')">Usuń</button>
        <h3>${esc(a.player)}</h3>
        <div class="meta">${fmtDate(a.date)}</div>
        <p style="margin:.4rem 0 0;">${esc(a.reason)}</p>
      </div>`).join('')
      : `<div class="empty"><span class="empty-ic">&#9997;</span>Żaden zawodnik nie zgłosił jeszcze nieobecności.</div>`;
  }
  return html;
}
function submitAbsence(e){
  e.preventDefault();
  data.absences.push({ id: uid(), player: session.name, date: document.getElementById('abDate').value, reason: document.getElementById('abReason').value.trim() });
  saveData(); editingAbsenceDate = null; render();
  return false;
}
function deleteAbsence(id){ if(session.role!=='coach') return; data.absences = data.absences.filter(a=>a.id!==id); saveData(); render(); }

/* ---------- AKTUALNOŚCI ---------- */
function renderNews(){
  let html = `<div class="section-title"><span class="sec-ic">&#128240;</span><span class="dash"></span><h2>Aktualności</h2></div>`;
  const list = data.news.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){
    html += `<div class="empty"><span class="empty-ic">&#128240;</span>Brak aktualności. ${session.role==='coach' ? 'Dodaj pierwszy wpis przyciskiem +.' : 'Zajrzyj tu wkrótce.'}</div>`;
  } else {
    list.forEach(n=>{

        <h3>${esc(n.title)}</h3><div class="meta">${fmtDate(n.date)}</div>
        <p style="margin:.5rem 0 0;">${esc(n.content)}</p>
      </div>`;
    });
  }
  return html;

function deleteNews(id){ if(session.role!=='coach') return; data.news = data.news.filter(n=>n.id!==id); saveData(); render(); }
function openNewsModal(){
  if(session.role!=='coach') return;
  openModal(`
    <div class="modal-head"><h3>Nowa aktualność</h3><button class="modal-x" onclick="closeModal()">&times;</button></div>
    <form onsubmit="return saveNews(event)">
      <label>Tytuł</label><input type="text" id="nTitle" required>
      <label>Data</label><input type="date" id="nDate" required value="${todayISO()}">
      <label>Treść</label><textarea id="nContent" rows="4" required></textarea>
      <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Opublikuj</button>
    </form>
  `);
}
function saveNews(e){
  e.preventDefault();
  if(session.role!=='coach') return false;
  data.news.push({ id: uid(), title: document.getElementById('nTitle').value.trim(), date: document.getElementById('nDate').value, content: document.getElementById('nContent').value.trim() });
  saveData(); closeModal(); render();

/* ---------- GALERIA ---------- */
function renderGallery(){
  let html = `<div class="section-title"><span class="sec-ic">&#128247;</span><span class="dash"></span><h2>Galeria</h2></div>`;
  if(!data.gallery.length){
    html += `<div class="empty"><span class="empty-ic">&#128247;</span>Galeria jest pusta. ${session.role==='coach' ? 'Dodaj pierwsze zdjęcie z meczu przyciskiem +.' : 'Trener jeszcze nic tu nie wrzucił.'}</div>`;
  } else {
    html += `<div class="gallery-grid">`;
    data.gallery.forEach(g=>{
      html += `<div class="gallery-tile">
        <img src="${esc(g.url)}" alt="${esc(g.caption||'Zdjęcie klubowe')}" loading="lazy">
        ${g.caption ? `<div class="cap">${esc(g.caption)}</div>` : ''}
        ${session.role==='coach' ? `<button class="del-btn" style="background:rgba(0,0,0,.5);border-radius:8px;color:#fff;padding:.15rem .4rem;" onclick="deleteGallery('${g.id}')">Usuń</button>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}
function deleteGallery(id){ if(session.role!=='coach') return; data.gallery = data.gallery.filter(g=>g.id!==id); saveData(); render(); }
function openGalleryModal(){
  if(session.role!=='coach') return;
  openModal(`
    <div class="modal-head"><h3>Dodaj zdjęcie</h3><button class="modal-x" onclick="closeModal()">&times;</button></div>
    <form onsubmit="return saveGallery(event)">
      <label class="file-picker" id="gPicker">
        <div class="fp-icon">&#128248;</div>
        <div class="fp-text" id="gPickerText">Kliknij, aby wybrać zdjęcie z galerii telefonu</div>
        <input type="file" id="gFile" accept="image/*" required>
      </label>
      <div id="gPreviewWrap"></div>
      <label>Podpis (opcjonalnie)</label><input type="text" id="gCap" placeholder="np. Mecz z LKS Poznań">
      <div class="error-msg" id="gErr"></div>
      <button type="submit" class="btn btn-primary" style="margin-top:.4rem;">Dodaj do galerii</button>
    </form>
  `);
  document.getElementById('gFile').addEventListener('change', function(ev){
    const file = ev.target.files[0];
    const wrap = document.getElementById('gPreviewWrap');
    if(!file){ wrap.innerHTML=''; return; }
    document.getElementById('gPickerText').textContent = file.name;
    const reader = new FileReader();
    reader.onload = e2 => {
      wrap.innerHTML = `<img src="${e2.target.result}" style="width:100%;border-radius:10px;margin-top:.7rem;max-height:220px;object-fit:cover;">`;
    };
    reader.readAsDataURL(file);
  });
}
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e1 => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e1.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function saveGallery(e){
  e.preventDefault();
  if(session.role!=='coach') return false;
  const fileInput = document.getElementById('gFile');
  const err = document.getElementById('gErr');
  const file = fileInput.files[0];
  if(!file){ err.textContent = 'Wybierz zdjęcie.'; return false; }
  const caption = document.getElementById('gCap').value.trim();
  compressImage(file, 1000, 0.78).then(dataUrl => {
    data.gallery.push({ id: uid(), url: dataUrl, caption });
    if(!saveData()){
      data.gallery.pop();
      err.textContent = 'Nie udało się zapisać zdjęcia w tej przeglądarce (brak miejsca lub tryb prywatny). Spróbuj mniejsze zdjęcie.';
      return;
    }
    closeModal(); render();
  }).catch(()=>{ err.textContent = 'Nie udało się wczytać zdjęcia. Spróbuj innego pliku.'; });
  return false;
}

/* ---------- FAB (dodawanie, tylko trener) ---------- */
function attachFab(){
  const old = document.querySelector('.fab-add');
  if(old) old.remove();
  if(session.role!=='coach') return;
  const map = { matches:openMatchModal, news:openNewsModal, gallery:openGalleryModal };
  if(!map[currentTab]) return;
  const btn = document.createElement('button');
  btn.className='fab-add';
  btn.innerHTML='+';
  btn.onclick = map[currentTab];
  document.body.appendChild(btn);
}

/* ---------- MODAL ---------- */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

/* ============================================================
   START
   ============================================================ */
if(session){
  document.getElementById('scene').classList.add('hide');
  enterApp();
} else {
  playIntro();
}
